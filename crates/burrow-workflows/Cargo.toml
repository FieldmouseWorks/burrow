[package]
name = "burrow-workflows"
description = "The shared workflows' tests: each runs a workflow's own steps, as a runner runs them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Tests only, all under tests/: the library is empty, and with no program
# the crate has no package.
[dev-dependencies]
burrow-upkeep = { path = "../burrow-upkeep" }
proc-macro2 = "1"
syn = { version = "3", features = ["full", "visit"] }
burrow-test = { path = "../burrow-test" }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
yaml_serde = "0.10.7"

[lints]
workspace = true
