[package]
name = "burrow-workflows"
description = "The shared workflows' tests: each runs a workflow's own steps, as a runner runs them"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Tests only: outside `cargo test` the crate is empty, so packages.burrow
# gets nothing from it.
[dev-dependencies]
regex = { version = "1.13.1", default-features = false, features = ["std"] }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
yaml_serde = "0.10.7"

[lints]
workspace = true
