[package]
name = "burrow-agent"
description = "agent: one disposable microVM per task, on its own ZFS clone of the data dataset"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-grants = { path = "../burrow-grants" }
# Conary owns what a plugin's describe declares. Pinned by Cargo.lock.
conary-core = { git = "https://github.com/FieldmouseWorks/Conary", rev = "585c52f964ba543ec13cfbd647aaf4fef721ce4d" }
jiff.workspace = true
rustix = { version = "1.1.6", features = ["fs", "process", "system"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[dev-dependencies]
burrow-test = { path = "../burrow-test" }
