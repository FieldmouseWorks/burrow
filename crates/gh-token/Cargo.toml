[package]
name = "gh-token"
description = "GitHub App installation tokens, minted on request from a key the asker can't read"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
ring = "0.17.14"
rustls-pki-types = "1.15.1"
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3.55", features = ["parsing"] }
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
