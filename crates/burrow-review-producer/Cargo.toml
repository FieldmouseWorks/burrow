[package]
name = "burrow-review-producer"
description = "Conary's review plugin and its producer: a fresh Codex look at a PR's head through the reviewers' service, and the flow's published review signed once it matches that look"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-brief = { path = "../burrow-brief" }
burrow-github = { path = "../burrow-github" }
burrow-producer = { path = "../burrow-producer" }
burrow-review = { path = "../burrow-review" }
burrow-settings = { path = "../burrow-settings" }
burrow-upkeep = { path = "../burrow-upkeep" }
# The plugin contract and the flow's markers are Conary's, pinned with the
# kit's by Cargo.lock.
conary-core = { git = "https://github.com/FieldmouseWorks/Conary", rev = "292aa71ecde12e34c22761ab050abcfddb12bbf4" }
conary-github = { git = "https://github.com/FieldmouseWorks/Conary", rev = "292aa71ecde12e34c22761ab050abcfddb12bbf4" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
burrow-test = { path = "../burrow-test" }
base64.workspace = true
burrow-github = { path = "../burrow-github", features = ["fake"] }
burrow-producer = { path = "../burrow-producer", features = ["test-key"] }
ed25519-dalek = "3.0.0"
tempfile.workspace = true

[lints]
workspace = true
