[package]
name = "burrow-fix"
description = "Conary's fix plugin and its broker: the flow's fix requests run as proj jobs, on the fixing role, one live fix a PR, stopped when the request is"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-brief = { path = "../burrow-brief" }
burrow-github = { path = "../burrow-github" }
burrow-producer = { path = "../burrow-producer" }
burrow-settings = { path = "../burrow-settings" }
# The plugin contract is Conary's, pinned with the kit's by Cargo.lock.
conary-core.workspace = true
conary-github.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
burrow-github = { path = "../burrow-github", features = ["fake"] }
burrow-test = { path = "../burrow-test" }
rustix = { version = "1.1.6", features = ["process"] }
tempfile.workspace = true

[lints]
workspace = true
