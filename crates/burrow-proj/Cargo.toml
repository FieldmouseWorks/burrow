[package]
name = "burrow-proj"
description = "Project work handed to agent jobs, each in its own project, in the background"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-probe = { path = "../burrow-probe" }
burrow-settings = { path = "../burrow-settings" }
burrow-process = { path = "../burrow-process" }
burrow-github = { path = "../burrow-github" }
burrow-codex = { path = "../burrow-codex" }
burrow-usage-reset = { path = "../burrow-usage-reset" }
burrow-events = { path = "../burrow-events" }
burrow-watchdog = { path = "../burrow-watchdog" }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rustix = { version = "1.1.6", features = ["process", "fs"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }

[dev-dependencies]
burrow-test = { path = "../burrow-test" }
gh-token = { path = "../gh-token" }
# The zones a usage limit's reset is said in, for tests on a machine with no
# tzdb (the Nix sandbox): a tzdb the system has still comes first.
jiff = { version = "0.2.38", default-features = false, features = ["tzdb-bundle-always"] }

[[test]]
name = "inbox-routing"
harness = false

[lints]
workspace = true
