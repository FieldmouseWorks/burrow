[package]
name = "burrow-engine-anthropic"
description = "Anthropic engine logic for Claude Code CLI and API modes: commands, streams, refusals and credit admission"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-grants = { path = "../burrow-grants" }
burrow-probe = { path = "../burrow-probe" }
burrow-process = { path = "../burrow-process" }
burrow-settings = { path = "../burrow-settings" }
conary-core.workspace = true
jiff.workspace = true
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
signal-hook = { version = "0.4.0", default-features = false, features = ["iterator"] }
tempfile.workspace = true

[dev-dependencies]
burrow-test = { path = "../burrow-test" }
# The zones a usage limit's reset is said in, for tests on a machine with no
# tzdb (the Nix sandbox): a tzdb the system has still comes first.
jiff = { version = "1.0.0", default-features = false, features = ["tzdb-bundle-always"] }

[lints]
workspace = true
