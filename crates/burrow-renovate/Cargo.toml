[package]
name = "burrow-renovate"
description = "renovate-run, Renovate over every repo it covers a run at a time, each with its own token; and renovate-sweep, the Renovate PRs that can't merge themselves handed to a Claude job"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-github = { path = "../burrow-github" }
burrow-house = { path = "../burrow-house" }
burrow-process = { path = "../burrow-process" }
burrow-settings = { path = "../burrow-settings" }
# Conary's seal: the MAC a major's verdict carries, which the steward and
# conaryd check it with.
conary-github.workspace = true
jiff.workspace = true
md-5 = "0.11.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
rustix = { version = "1.1.6", features = ["fs", "rand"] }
serde.workspace = true
serde_json.workspace = true
subtle = "2.6.1"
tempfile.workspace = true

[dev-dependencies]
burrow-test = { path = "../burrow-test" }
# Conary's flow, which reads the v2 verdicts the sweep seals (tests/sweep/conary.rs).
conary-core.workspace = true

[lints]
workspace = true
