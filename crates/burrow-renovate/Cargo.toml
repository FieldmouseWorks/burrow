[package]
name = "burrow-renovate"
description = "renovate-run, Renovate over every repo it covers a run at a time, each with its own token; and renovate-sweep, the Renovate PRs that can't merge themselves handed to a Claude job"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
burrow-process = { path = "../burrow-process" }
burrow-github = { path = "../burrow-github" }
jiff.workspace = true
md-5 = "0.11.0"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
burrow-test = { path = "../burrow-test" }
tempfile.workspace = true

[lints]
workspace = true
