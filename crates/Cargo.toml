# burrow's one Cargo workspace: every program a module runs is a crate here
# (AGENTS.md, Build and test). The flake builds each crate's as
# packages.SYSTEM.CRATE (lib/project.nix's rust.members) and gates them as
# checks.crates-*.
[workspace]
members = ["advisory-watch", "burrow-agent", "burrow-backup", "burrow-browser-close", "burrow-dispatch", "burrow-events", "burrow-github", "burrow-guard", "burrow-health", "burrow-heartbeat", "burrow-heavy", "burrow-house", "burrow-keep", "burrow-notify", "burrow-probe", "burrow-proof", "burrow-proj", "burrow-review", "burrow-robot", "burrow-rustc-wrapper", "burrow-update", "burrow-upkeep", "burrow-usage-reset", "burrow-watchdog", "burrow-workflows", "flaky", "gh-token", "house-sync", "lock-age"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# What more than one crate uses, at one version.
[workspace.dependencies]
base64 = "0.23.1"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }

# The name of the whole workspace's builds: its checks (burrow-test and the like).
[workspace.metadata.crane]
name = "burrow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
