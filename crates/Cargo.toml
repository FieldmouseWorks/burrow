# burrow's one Cargo workspace: every program a module runs is a crate here
# (AGENTS.md, Build and test). The flake builds each crate's as
# packages.SYSTEM.CRATE (lib/project.nix's rust.members) and gates them as
# checks.crates-*.
[workspace]
members = [
    "advisory-watch",
    "burrow-agent",
    "burrow-backup",
    "burrow-boot",
    "burrow-browser-close",
    "burrow-codeql",
    "burrow-dashboard",
    "burrow-dispatch",
    "burrow-door",
    "burrow-engine-anthropic",
    "burrow-engine-antigravity",
    "burrow-events",
    "burrow-engines-door",
    "burrow-example-plugin",
    "burrow-firmware",
    "burrow-flake-check",
    "burrow-github",
    "burrow-grants",
    "burrow-guidance",
    "burrow-guard",
    "burrow-health",
    "burrow-heartbeat",
    "burrow-heavy",
    "burrow-landing",
    "burrow-house",
    "burrow-judge",
    "burrow-keep",
    "burrow-ledger-access",
    "burrow-ledger-door",
    "burrow-ledger-sync",
    "burrow-notify",
    "burrow-probe",
    "burrow-proj",
    "burrow-settings",
    "burrow-process",
    "burrow-brief",
    "burrow-builds",
    "burrow-producer",
    "burrow-fix",
    "burrow-flow-files",
    "burrow-proof",
    "burrow-renovate",
    "burrow-review-ask",
    "burrow-robot",
    "burrow-rustc-wrapper",
    "burrow-switch",
    "burrow-systemd",
    "burrow-test",
    "burrow-units",
    "burrow-update",
    "burrow-upkeep",
    "burrow-usage-reset",
    "burrow-watchdog",
    "burrow-workflows",
    "cargo-follow",
    "flaky",
    "gh-token",
    "house-sync",
    "lock-age",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# What more than one crate uses, at one version.
[workspace.dependencies]
base64 = "0.23.1"
# Conary's own types: one rev for every crate, so a bump moves them all, a
# crate a branch adds meanwhile too.
conary-core = { git = "https://github.com/FieldmouseWorks/Conary", rev = "e3a1687b0d8b99c6b7e167a556c7099ae4f6d530" }
conary-github = { git = "https://github.com/FieldmouseWorks/Conary", rev = "e3a1687b0d8b99c6b7e167a556c7099ae4f6d530" }
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
ureq = { version = "3.5.0", features = ["json", "platform-verifier"] }

# What cargo-follow (modules/updates/follow.nix) leaves the Conary pin at
# when Conary's main changes only these: burrow takes Conary's crates, and
# the machine builds its flake.nix's outputs with burrow's own inputs, so
# Conary's lock, its workflows and the line pinning its burrow change
# nothing either builds. Without that, every Conary merge of a burrow pin
# would make the next burrow pin PR, and back.
[workspace.metadata.follow."https://github.com/FieldmouseWorks/Conary"]
inert = [".github/", "flake.lock"]
inert-lines = { "flake.nix" = ["inputs.burrow.url ="] }

# The name of the whole workspace's builds: its checks (burrow-test and the like).
[workspace.metadata.crane]
name = "burrow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
