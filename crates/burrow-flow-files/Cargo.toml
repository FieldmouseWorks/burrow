[package]
name = "burrow-flow-files"
description = "Reads the files a machine's build renders for Conary (each repo's flow config, the class policy, conaryd's events file) with Conary's own loaders, so a check can refuse what the machine's cn would"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Conary's own types and loaders, never a copy of their keys. Pinned with the
# kit's by Cargo.lock.
conary-core = { git = "https://github.com/FieldmouseWorks/Conary", rev = "437b4f306ad48b6b76e2ddb3470c1e2a47c87a5e" }
conary-github = { git = "https://github.com/FieldmouseWorks/Conary", rev = "437b4f306ad48b6b76e2ddb3470c1e2a47c87a5e" }

[lints]
workspace = true
