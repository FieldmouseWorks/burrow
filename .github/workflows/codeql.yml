# Code scanning, shared: every project calls it from a code-scanning.yml of
# its own, with the CodeQL languages it has. It replaces GitHub's default
# setup, which ran every language on every PR push and held a hosted runner
# for each, whatever the PR changed.
#
# A PR scans only the languages its changed files are in (`pick` below). A
# push to the default branch scans every language, so each merged tree is
# scanned whole and the code-scanning alerts stay current.
#
# It takes only the languages CodeQL analyzes on Linux with no build
# (`build-mode: none`): actions, c-cpp, javascript-typescript, python, ruby
# and rust. Any other language fails `pick` rather than being analyzed wrong;
# one that needs a build or another runner (Go, Java/Kotlin, Swift, C#)
# gets its own setup when a project has it.
#
# The caller cancels a PR's superseded run whole when its new run is made
# (workflow-level `concurrency`, keyed as burrow's code-scanning.yml keys
# it), and reruns on a retarget (`edited` with a base change), so an older
# run's analysis never outlives or cancels a newer one's.
name: codeql
on:
  workflow_call:
    inputs:
      languages:
        description: The project's CodeQL languages, as a JSON array.
        type: string
        required: true
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          # The files each language's extractor reads, matched without
          # regard to case. A pattern errs wide: a file it might read
          # counts.
          declare -A match=(
            [actions]='(^|/)\.github/(workflows|actions)/.*\.ya?ml$|(^|/)action\.ya?ml$'
            [c-cpp]='\.(c|cc|cp|cpp|cxx|c\+\+|h|hh|hp|hpp|hxx|h\+\+|inl|ipp|tcc|tpp|ixx|cppm|ii|i)$|(^|/)(cmakelists\.txt|makefile|meson\.build)$'
            [javascript-typescript]='\.(js|jsx|mjs|cjs|es|es6|ts|tsx|mts|cts|vue|svelte|html?|xhtml?|xht|ejs|hbs|handlebars|njk|json|jsonc|json5|ya?ml|raml)$|(^|/)(\.babelrc|\.eslintrc|\.npmrc|tsconfig[^/]*|jsconfig[^/]*)$'
            [python]='\.(py|pyi|pyw)$|(^|/)(pyproject\.toml|setup\.cfg|requirements[^/]*\.txt|pipfile(\.lock)?)$'
            [ruby]='\.(rb|erb|rake|gemspec|ru|rbw|builder|jbuilder|thor)$|(^|/)(gemfile(\.lock)?|rakefile|guardfile|vagrantfile)$'
            [rust]='\.rs$|(^|/)(cargo\.(toml|lock)|rust-toolchain(\.toml)?)$'
          )
          all=$(jq -c . <<<"$LANGUAGES")
          while read -r lang; do
            if [ -z "${match[$lang]:-}" ]; then
              echo "::error::$lang: this workflow doesn't analyze it (it takes $(printf '%s ' "${!match[@]}")); give it a setup of its own."
              exit 1
            fi
          done < <(jq -r '.[]' <<<"$all")
          if [ "$EVENT" != pull_request ]; then
            echo "Not a PR: every language, $all."
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every path the PR touches, deleted ones and renames' old paths
          # included. GitHub lists at most 3000; a PR that big scans
          # everything.
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if [ "$(grep -c . <<<"$files" || true)" -ge 3000 ]; then
            echo "3000 or more changed files: every language, $all."
            echo "languages=$all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          picked=()
          while read -r lang; do
            if grep -Eiq "${match[$lang]}" <<<"$files"; then
              echo "$lang: the PR changes its files."
              picked+=("$lang")
            else
              echo "$lang: the PR changes none of its files, so not scanned here (the merge's push scans it)."
            fi
          done < <(jq -r '.[]' <<<"$all")
          out=$(printf '%s\n' "${picked[@]}" | jq -Rnc '[inputs | select(. != "")]')
          echo "languages=$out" >> "$GITHUB_OUTPUT"
  analyze:
    needs: pick
    if: needs.pick.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.pick.outputs.languages) }}
    name: analyze (${{ matrix.language }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
