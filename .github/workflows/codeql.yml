# Code scanning, shared: every project calls it from a code-scanning.yml of
# its own, with the CodeQL languages it has. It replaces GitHub's default
# setup, which ran every language on every PR push and held a hosted runner
# for each, whatever the PR changed.
#
# A PR scans only the languages its changed paths might be input to, and
# every language for a path nothing classifies; a push to the default branch
# scans every language, so each merged tree is scanned whole and the
# code-scanning alerts stay current. crates/burrow-codeql decides, and says
# how.
#
# It takes only the languages CodeQL analyzes on Linux with no build
# (`build-mode: none`): actions, c-cpp, javascript-typescript, python, ruby
# and rust. Any other language fails `pick` rather than being analyzed wrong;
# one that needs a build or another runner (Go, Java/Kotlin, Swift, C#)
# gets its own setup when a project has it.
#
# The caller cancels a PR's superseded run whole when its new run is made
# (workflow-level `concurrency`, keyed as burrow's code-scanning.yml keys
# it), and reruns on a retarget (`edited` with a base change), so an older
# run's analysis never outlives or cancels a newer one's.
name: codeql
on:
  workflow_call:
    inputs:
      languages:
        description: The project's CodeQL languages, as a JSON array.
        type: string
        required: true
permissions:
  contents: read
jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      languages: ${{ steps.pick.outputs.languages }}
    steps:
      # The picker, from this workflow's own commit, which job.workflow_sha
      # names whoever calls it, built on the runner's cargo in the crates'
      # directory as the house action builds its check: rustup reads the
      # toolchain crates/rust-toolchain.toml pins from where cargo runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codeql-pick
          persist-credentials: false
          sparse-checkout: crates
      - id: pick
        shell: bash
        working-directory: .codeql-pick/crates
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/codeql-pick
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          cargo build --release --locked --quiet -p burrow-codeql
          "$CARGO_TARGET_DIR/release/burrow-codeql" pick
  analyze:
    needs: pick
    if: needs.pick.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.pick.outputs.languages) }}
    name: analyze (${{ matrix.language }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
