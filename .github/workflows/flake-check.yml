# The shared CI for every repo whose gate is its flake (burrow's
# lib/project.nix): check out, install Nix, `nix flake check`, then attest the
# result for Conary's ledger; on a PR, also check that GitHub verifies every
# signed commit it adds. Called from a repo's own workflow with `uses:`, whose
# job grants `id-token: write` and `attestations: write` (a called job gets no
# more than its caller gives). Its actions are pinned to commits (repos that
# allow only pinned actions need that), and Renovate keeps the pins current.
name: flake-check
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label to run on, such as a self-hosted runner's.
        type: string
        default: ubuntu-latest
      install-nix:
        description: Install Nix first. False on a runner that has it already (NixOS).
        type: boolean
        default: true
      build-skip:
        description: >-
          Space-separated checks to evaluate but not build, for a check this
          runner can't run (one that needs nested KVM, say). The caller says
          where that check does run.
        type: string
        default: ''
      eval-apart:
        description: >-
          Evaluate each check, package, dev shell, formatter and NixOS system
          in a nix process of its own, then build the checks, rather than in
          one `nix flake check` that holds every evaluation in memory until
          its last build ends. For a flake whose evaluations don't fit in its
          runner's memory together. It also checks nixosModules and templates
          as nix flake check does, and forces lib and the outputs nix flake
          check doesn't know, warning of these; it fails a flake with an
          output nix flake check checks some other way (apps, overlays,
          hydraJobs, bundlers, the old default* ones), or with a nixConfig.
        type: boolean
        default: false
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # The attestation: a GitHub OIDC token to sign it with, and the API
      # that keeps it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check only reads the tree, and on a self-hosted runner a token
          # left in .git/config outlives the job.
          persist-credentials: false
      - if: inputs.install-nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - id: gate
        shell: bash
        env:
          SKIP: ${{ inputs.build-skip }}
          APART: ${{ inputs.eval-apart }}
        run: |
          # eval-apart: what `nix flake check` checks of the outputs it knows,
          # from the flake as locked and evaluated purely, as nix flake check
          # evaluates it. With no entry, the plan: the outputs it doesn't know,
          # and each derivation it evaluates and whether it's a check to build.
          # With an entry's index, that one: its derivation, or for a NixOS
          # system nothing, once its toplevel is a derivation.
          read -r -d '' plan <<'EOF' || true
          { url, system, skip, entry ? null }:
          let
            flake = builtins.getFlake url;
            inherit (flake) outputs;
            known = [ "checks" "packages" "devShells" "formatter" "nixosConfigurations" "legacyPackages" "nixosModules" "templates" ];
            # What nix flake check checks that this doesn't.
            refused = [ "apps" "defaultPackage" "defaultApp" "devShell" "overlay" "overlays" "nixosModule" "hydraJobs" "defaultTemplate" "bundlers" "defaultBundler" ];
            # What nix flake check only forces, and doesn't warn of.
            community = [ "lib" "darwinConfigurations" "darwinModules" "flakeModule" "flakeModules" "herculesCI" "homeConfigurations" "homeModule" "homeModules" "nixopsConfigurations" ];
            names = builtins.attrNames outputs;
            set = what: v: if builtins.isAttrs v then v else throw "flake output '${what}' is not an attribute set";
            # Every output is forced, and a NixOS module is only forced.
            forced = builtins.foldl' (a: n: builtins.seq outputs.${n} a) true names;
            modules = builtins.mapAttrs (_: m: builtins.seq m true) (set "nixosModules" (outputs.nixosModules or { }));
            template = n: t:
              let
                what = "templates.${n}";
                extra = builtins.filter (a: !builtins.elem a [ "path" "description" "welcomeText" ]) (builtins.attrNames t);
              in
              if !(t ? path) then throw "template '${what}' lacks attribute 'path'"
              else if !builtins.pathExists t.path then throw "template '${what}' refers to a non-existent path '${toString t.path}'"
              else if !(t ? description) then throw "template '${what}' lacks attribute 'description'"
              else if !builtins.isString t.description || builtins.hasContext t.description then throw "the description of template '${what}' is not a string without context"
              else if extra != [ ] then throw "template '${what}' has unsupported attribute '${builtins.head extra}'"
              else true;
            templates = builtins.mapAttrs (n: t: template n (set "templates.${n}" t)) (set "templates" (outputs.templates or { }));
            # An output by system: every system's name has a dash, and only
            # this system's outputs are checked further.
            here = name: f:
              let
                systems = map
                  (s: if builtins.length (builtins.split "-" s) > 1 then s
                    else throw "'${s}' in flake output '${name}' is not a valid system type")
                  (builtins.attrNames (set name outputs.${name}));
              in
              if !(outputs ? ${name}) then [ ]
              else builtins.deepSeq systems (if builtins.elem system systems then f outputs.${name}.${system} else [ ]);
            each = name: here name (s: map
              (n: { what = "${name}.${system}.${n}"; path = [ name system n ]; check = name == "checks"; inherit n; })
              (builtins.attrNames (set "${name}.${system}" s)));
            entries =
              each "checks" ++ each "packages" ++ each "devShells"
              ++ here "formatter" (_: [ { what = "formatter.${system}"; path = [ "formatter" system ]; } ])
              ++ map
                (n: { what = "nixosConfigurations.${n}"; path = [ "nixosConfigurations" n "config" "system" "build" "toplevel" ]; nixos = true; })
                (builtins.attrNames (set "nixosConfigurations" (outputs.nixosConfigurations or { })));
            skipped = builtins.filter (s: builtins.isString s && s != "") (builtins.split " " skip);
            build = e: e.check or false && !builtins.elem e.n skipped;
            isDerivation = v: (v.type or null) == "derivation";
          in
          if entry == null then
            # legacyPackages has only its system names checked.
            builtins.deepSeq [ (here "legacyPackages" (_: [ ])) forced modules templates ] {
              nixConfig = import "${flake.outPath}/flake.nix" ? nixConfig;
              other = builtins.filter (n: builtins.elem n refused) names;
              unknown = builtins.filter (n: !builtins.elem n (known ++ refused ++ community)) names;
              entries = map (e: { inherit (e) what; build = build e; skip = e.check or false && !build e; }) entries;
            }
          else
            let
              e = builtins.elemAt entries entry;
              v = builtins.foldl' (v: n: v.${n}) outputs e.path;
            in
            if e.nixos or false then
              (if isDerivation v then [ ] else throw "'config.system.build.toplevel' of ${e.what} is not a derivation")
            else if isDerivation v then v
            else throw "flake attribute '${e.what}' is not a derivation"
          EOF
          apart() {
            roots=$(mktemp -d "$RUNNER_TEMP/roots.XXXXXX")
            trap 'rm -rf -- "$roots"' EXIT
            nix flake metadata --json . > "$RUNNER_TEMP/flake.json"
            url=$(jq -r .url "$RUNNER_TEMP/flake.json")
            # A checkout with changes not yet committed (run here by
            # flake-gate) has no locked git reference to evaluate purely: its
            # source as nix flake check sees it, by its hash, kept until the
            # gate is done.
            if [ "$(jq '.locked | has("rev")' "$RUNNER_TEMP/flake.json")" != true ]; then
              source=$(jq -r .path "$RUNNER_TEMP/flake.json")
              nix-store --add-root "$roots/source" --realise "$source" > /dev/null
              url="path:$source?narHash=$(jq -r '.locked.narHash | @uri' "$RUNNER_TEMP/flake.json")"
            fi
            args=(--option pure-eval true --expr "$plan" --argstr url "$url"
              --argstr system "$(nix config show system)" --argstr skip "$SKIP")
            nix-instantiate --eval --strict --json "${args[@]}" > "$RUNNER_TEMP/plan.json"
            if [ "$(jq '.other | length' "$RUNNER_TEMP/plan.json")" != 0 ]; then
              echo "eval-apart doesn't check apps, overlays, hydraJobs, bundlers or the old default* outputs, and this flake has $(jq -c .other "$RUNNER_TEMP/plan.json"). Its gate is a whole \`nix flake check\`, without eval-apart."
              return 1
            fi
            jq -r '.unknown[] | "warning: unknown flake output \u0027\(.)\u0027"' "$RUNNER_TEMP/plan.json"
            # nix flake check applies the nixConfig a runner accepts; the
            # evaluations and the build here would leave it out.
            if [ "$(jq .nixConfig "$RUNNER_TEMP/plan.json")" = true ]; then
              echo "eval-apart can't carry this flake's nixConfig to every evaluation and build. Its gate is a whole \`nix flake check\`, without eval-apart."
              return 1
            fi
            # Each evaluation exits before the next starts, so the most memory
            # in use is one evaluation's, and makes its derivation a GC root
            # before it exits, until the build is done. A failed one fails the
            # gate, after the rest are evaluated and built (--keep-going).
            failed=0
            targets=()
            n=$(jq '.entries | length' "$RUNNER_TEMP/plan.json")
            for ((i = 0; i < n; i++)); do
              what=$(jq -r ".entries[$i].what" "$RUNNER_TEMP/plan.json")
              echo "evaluating $what"
              if ! nix-instantiate --add-root "$roots/$i" --arg entry "$i" "${args[@]}" > /dev/null; then
                failed=1
              elif [ "$(jq ".entries[$i].build" "$RUNNER_TEMP/plan.json")" = true ]; then
                if drv=$(readlink "$roots/$i"); then
                  targets+=("$drv^*")
                else
                  echo "evaluating $what gave no derivation"
                  failed=1
                fi
              elif [ "$(jq ".entries[$i].skip" "$RUNNER_TEMP/plan.json")" = true ]; then
                echo "not building $what"
              fi
            done
            if [ ${#targets[@]} -gt 0 ]; then
              nix build -L --no-link --keep-going "${targets[@]}" || failed=1
            fi
            return $failed
          }
          gate() {
            if [ "$APART" = true ]; then
              apart
              return
            fi
            if [ -z "$SKIP" ]; then
              nix flake check -L --keep-going
              return
            fi
            nix flake check --no-build -L
            system=$(nix eval --impure --raw --expr builtins.currentSystem)
            targets=()
            for c in $(nix eval --raw ".#checks.$system" --apply 'cs: toString (builtins.attrNames cs)'); do
              case " $SKIP " in *" $c "*) echo "not building $c"; continue ;; esac
              targets+=(".#checks.$system.$c")
            done
            nix build -L --no-link --keep-going "${targets[@]}"
          }
          gate 2>&1 | tee "$RUNNER_TEMP/flake.log"
      # The gate's result, signed with this job's own GitHub identity, in the
      # format Conary reads (FieldmouseWorks/Conary, docs/ci-attestation.md).
      # GitHub attests for private repositories only on Enterprise Cloud, and
      # a run with no OIDC token (a fork's PR, Dependabot's) can't sign, so
      # those get none and their results don't count as evidence.
      - id: subject
        if: ${{ !cancelled() && steps.gate.outcome != 'skipped' && !github.event.repository.private && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
          SKIP: ${{ inputs.build-skip }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "no OIDC token in this run, so no attestation"
            exit 0
          fi
          case $OUTCOME in success) result=pass ;; *) result=fail ;; esac
          # Artifact names are shared by every job in a run, and a caller may
          # run this job more than once (a matrix, a re-run), so each log gets
          # its own.
          log="flake-log-$(cat /proc/sys/kernel/random/uuid)"
          dir="$RUNNER_TEMP/conary"
          mkdir -p "$dir"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The checked commit is GitHub's merge of the head onto the base
            # branch; its parents name both. The raw commit, since a shallow
            # clone hides a commit's parents from git log.
            { read -r tip; read -r head; } < <(git cat-file commit HEAD | sed -n 's/^parent //p')
            [ "$head" = "$PR_HEAD" ] || { echo "checked $GITHUB_SHA isn't a merge of $PR_HEAD"; exit 1; }
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tip...$head" --jq .merge_base_commit.sha)
            subject="$dir/conary-revision"
            printf 'conary revision v1\n%s\n%s\n' "$base" "$head" > "$subject"
            revision=$(jq -n --arg base "$base" --arg head "$head" '{$base, $head}')
          else
            subject="$dir/conary-commit"
            printf 'conary commit v1\n%s\n' "$GITHUB_SHA" > "$subject"
            revision=null
          fi
          jq -n --arg result "$result" --argjson revision "$revision" \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" --arg skip "$SKIP" \
            --arg sha256 "$(sha256sum "$RUNNER_TEMP/flake.log" | cut -d' ' -f1)" --arg artifact "$log" \
            '{$result, $revision, $tree, skipped: ($skip | split(" ") | map(select(. != ""))), log: {$sha256, $artifact}}' \
            > "$dir/predicate.json"
          cat "$subject" "$dir/predicate.json"
          { echo "path=$subject"; echo "log=$log"; } >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.subject.outputs.path }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.subject.outputs.log }}
          path: ${{ runner.temp }}/flake.log
      - if: ${{ !cancelled() && steps.subject.outputs.path }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subject.outputs.path }}
          predicate-type: https://github.com/FieldmouseWorks/Conary/blob/main/docs/ci-attestation.md#v1
          predicate-path: ${{ runner.temp }}/conary/predicate.json
  # A PR's commits as GitHub sees them: each one unsigned, or signed by a key
  # GitHub matches to its committer. One signed by a key that isn't its
  # committer's (a session's own key on a commit given someone else's name and
  # email) shows as Unverified, as if someone were posing as them.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - id: signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The commits the PR adds, the ones HEAD has and its merge base with
          # BASE doesn't, with GitHub's verdict on each one's signature. Only
          # the commit and the verdict go in the log, never who committed it.
          compare="repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD"
          fork=$(gh api "$compare" --jq .merge_base_commit.sha)
          gh api --paginate "$compare?per_page=100" \
            --jq '.commits[] | [.sha, .commit.verification.reason] | @tsv' \
            > "$RUNNER_TEMP/commits.tsv"
          bad=0
          while IFS=$'\t' read -r sha reason; do
            case $reason in
              valid | unsigned) echo "$sha: $reason" ;;
              *)
                bad=1
                echo "::error title=Unverified commit::$sha is signed, but GitHub can't verify the signature for its committer ($reason), so it shows as Unverified. Commit as the identity that signs your commits, never under someone else's name and email. To fix it, recommit the branch that way (git rebase --rebase-merges --exec 'git commit --amend --no-edit --reset-author' $fork) and push it with --force-with-lease."
                ;;
            esac
          done < "$RUNNER_TEMP/commits.tsv"
          exit "$bad"
