# The shared CI for every repo whose gate is its flake (burrow's
# lib/project.nix): check out, install Nix, `nix flake check`. Called from a
# repo's own workflow with `uses:`. Its actions are pinned to commits (repos that
# allow only pinned actions need that), and Renovate keeps the pins current.
name: flake-check
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label to run on, such as a self-hosted runner's.
        type: string
        default: ubuntu-latest
      install-nix:
        description: Install Nix first. False on a runner that has it already (NixOS).
        type: boolean
        default: true
      build-skip:
        description: >-
          Space-separated checks to evaluate but not build, for a check this
          runner can't run (one that needs nested KVM, say). The caller says
          where that check does run.
        type: string
        default: ''
jobs:
  check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The check only reads the tree, and on a self-hosted runner a token
          # left in .git/config outlives the job.
          persist-credentials: false
      - if: inputs.install-nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - if: inputs.build-skip == ''
        run: nix flake check -L --keep-going
      - if: inputs.build-skip != ''
        env:
          SKIP: ${{ inputs.build-skip }}
        run: |
          nix flake check --no-build -L
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          targets=()
          for c in $(nix eval --raw ".#checks.$system" --apply 'cs: toString (builtins.attrNames cs)'); do
            case " $SKIP " in *" $c "*) echo "not building $c"; continue ;; esac
            targets+=(".#checks.$system.$c")
          done
          nix build -L --no-link --keep-going "${targets[@]}"
