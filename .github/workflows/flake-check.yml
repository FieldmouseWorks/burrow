# The shared CI for every repo whose gate is its flake (burrow's
# lib/project.nix): check out, install Nix, `nix flake check`, then attest the
# result for Conary's ledger; on a PR, also check that GitHub verifies every
# signed commit it adds (with pr-gate off, only that). Called from a repo's own
# workflow with `uses:`, whose job grants `id-token: write` and
# `attestations: write` (a called job gets no more than its caller gives). Its
# actions are pinned to commits (repos that allow only pinned actions need
# that), and Renovate keeps the pins current.
name: flake-check
on:
  workflow_call:
    inputs:
      runner:
        description: The runner label to run on, such as a self-hosted runner's.
        type: string
        default: ubuntu-latest
      install-nix:
        description: Install Nix first. False on a runner that has it already (NixOS).
        type: boolean
        default: true
      build-skip:
        description: >-
          Space-separated checks to evaluate but not build, for a check this
          runner can't run (one that needs nested KVM, say). The caller says
          where that check does run.
        type: string
        default: ''
      eval-apart:
        description: >-
          Evaluate each check, package, dev shell, formatter and NixOS system
          in a nix process of its own, then build the checks, rather than the
          checks in one process and then everything in one `nix flake check`.
          For a flake whose evaluations don't fit in its runner's memory
          together, even with no build beside them. It also checks nixosModules
          and templates as nix flake check does, and forces lib and the outputs
          nix flake check doesn't know, warning of these; it fails a flake with
          an output nix flake check checks some other way (apps, overlays,
          hydraJobs, bundlers, the old default* ones), or with a nixConfig.
          It evaluates one snapshot of the checkout throughout, so it fails a
          flake whose lock file needs changing, where nix flake check would
          write it.
        type: boolean
        default: false
      pr-gate:
        description: >-
          Run the gate on a PR to the default branch. False in a repo whose
          PRs land through its merge train, which runs the gate on each
          candidate it would land (a push to a conary/train/ branch) rather
          than on the PRs in it, so such a PR's own run checks only its
          commits. A PR to any other branch, which the train doesn't land,
          still gets the gate. A caller that turns it off runs on
          pull_request's `edited` too, so a PR retargeted away from the
          default branch gets the gate for its new base.
        type: boolean
        default: true
jobs:
  # With pr-gate off, whether this PR is one the train lands: its base is the
  # default branch, compared as git compares refs. An expression's == ignores
  # case, so `Main` would pass for `main`, and the train wouldn't take it.
  train:
    if: ${{ !inputs.pr-gate && github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    permissions: {}
    outputs:
      lands: ${{ steps.base.outputs.lands }}
    steps:
      - id: base
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BASE" = "$DEFAULT" ]; then lands=true; else lands=false; fi
          echo "a PR to $BASE (the default branch is $DEFAULT): the train lands it: $lands"
          echo "lands=$lands" >>"$GITHUB_OUTPUT"
  check:
    # Unless the train lands it: anything but a clear yes, the train job's
    # failure included, is a no.
    needs: train
    if: ${{ !cancelled() && (inputs.pr-gate || github.event_name != 'pull_request' || needs.train.outputs.lands != 'true') }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      # The attestation: a GitHub OIDC token to sign it with, and the API
      # that keeps it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check only reads the tree, and on a self-hosted runner a token
          # left in .git/config outlives the job.
          persist-credentials: false
          # A PR's head, with every branch's history (a depth of 0 fetches
          # them all), for the merge step below.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      # A PR is checked merged with its base branch as that branch is now, when
      # the job starts. GitHub's merge commit for the run (github.sha) is the
      # base as it was when the event fired, which a run that waited in a
      # runner's queue, or a re-run, would test long after its base moved on.
      - id: merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tip=$(git rev-parse --verify "refs/remotes/origin/$BASE^{commit}")
          echo "checking $HEAD_SHA merged with $BASE at $tip"
          git checkout -q --detach "$tip"
          # Base first, then the head, as GitHub orders its merge's parents.
          if ! git -c user.name=flake-check -c user.email=flake-check@localhost -c commit.gpgsign=false \
              merge -q --no-ff --no-edit "$HEAD_SHA"; then
            git merge --abort || true
            echo "::error title=Conflicts with its base::$HEAD_SHA no longer merges cleanly with $BASE at $tip, so nothing was checked. Merge $BASE into the branch and push."
            exit 1
          fi
      - if: inputs.install-nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - id: gate
        shell: bash
        env:
          SKIP: ${{ inputs.build-skip }}
          APART: ${{ inputs.eval-apart }}
        run: |
          # eval-apart: what `nix flake check` checks of the outputs it knows,
          # given the flake's outputs as `nix eval` evaluates the checkout's
          # snapshot (purely, with the same source and self as nix flake
          # check, a checkout with uncommitted changes included). With no
          # entry, the plan: the outputs it can't check or doesn't know, and
          # each derivation it evaluates, whether it's a check and whether
          # it's a NixOS system. With an entry's index, that one: for a NixOS
          # system nothing, once its toplevel is a derivation; for the rest
          # its derivation's path, once it's a derivation as nix flake check
          # reads one (a name that's a string without context) with a drvPath
          # that's a store derivation's path. With builds, every check to
          # build but those in skip, as a list: in an attrset nix-instantiate
          # passes over any name that isn't an identifier, a.b or "sp ace",
          # without a word.
          read -r -d '' plan <<'EOF' || true
          { system, entry ? null, builds ? false, skip ? "" }: outputs:
          let
            known = [ "checks" "packages" "devShells" "formatter" "nixosConfigurations" "legacyPackages" "nixosModules" "templates" ];
            # What nix flake check checks that this doesn't.
            refused = [ "apps" "defaultPackage" "defaultApp" "devShell" "overlay" "overlays" "nixosModule" "hydraJobs" "defaultTemplate" "bundlers" "defaultBundler" ];
            # What nix flake check only forces, and doesn't warn of.
            community = [ "lib" "darwinConfigurations" "darwinModules" "flakeModule" "flakeModules" "herculesCI" "homeConfigurations" "homeModule" "homeModules" "nixopsConfigurations" ];
            names = builtins.attrNames outputs;
            set = what: v: if builtins.isAttrs v then v else throw "flake output '${what}' is not an attribute set";
            # Every output is forced, and a NixOS module is only forced.
            forced = builtins.foldl' (a: n: builtins.seq outputs.${n} a) true names;
            modules = builtins.mapAttrs (_: m: builtins.seq m true) (set "nixosModules" (outputs.nixosModules or { }));
            template = n: t:
              let
                what = "templates.${n}";
                extra = builtins.filter (a: !builtins.elem a [ "path" "description" "welcomeText" ]) (builtins.attrNames t);
              in
              if !(t ? path) then throw "template '${what}' lacks attribute 'path'"
              else if !builtins.pathExists t.path then throw "template '${what}' refers to a non-existent path '${toString t.path}'"
              else if !(t ? description) then throw "template '${what}' lacks attribute 'description'"
              else if !builtins.isString t.description || builtins.hasContext t.description then throw "the description of template '${what}' is not a string without context"
              else if extra != [ ] then throw "template '${what}' has unsupported attribute '${builtins.head extra}'"
              else true;
            templates = builtins.mapAttrs (n: t: template n (set "templates.${n}" t)) (set "templates" (outputs.templates or { }));
            # An output by system: every system's name has a dash, and only
            # this system's outputs are checked further.
            here = name: f:
              let
                systems = map
                  (s: if builtins.length (builtins.split "-" s) > 1 then s
                    else throw "'${s}' in flake output '${name}' is not a valid system type")
                  (builtins.attrNames (set name outputs.${name}));
              in
              if !(outputs ? ${name}) then [ ]
              else builtins.deepSeq systems (if builtins.elem system systems then f outputs.${name}.${system} else [ ]);
            each = name: here name (s: map
              (n: { what = "${name}.${system}.${n}"; path = [ name system n ]; check = name == "checks"; inherit n; })
              (builtins.attrNames (set "${name}.${system}" s)));
            entries =
              each "checks" ++ each "packages" ++ each "devShells"
              ++ here "formatter" (_: [ { what = "formatter.${system}"; path = [ "formatter" system ]; } ])
              ++ map
                (n: { what = "nixosConfigurations.${n}"; path = [ "nixosConfigurations" n "config" "system" "build" "toplevel" ]; nixos = true; })
                (builtins.attrNames (set "nixosConfigurations" (outputs.nixosConfigurations or { })));
            skipped = builtins.filter (s: builtins.isString s && s != "") (builtins.split " " skip);
            build = e: e.check or false && !builtins.elem e.n skipped;
            isDerivation = v: (v.type or null) == "derivation";
            store = builtins.storeDir + "/";
            # A store derivation's hash and name, as nix reads a store path's
            # (a name of at most 211 characters; ending in .drv, it's never
            # "." or "..").
            drvName = "[0-9a-df-np-sv-z]{32}-[A-Za-z0-9+._?=-]+[.]drv";
            drvPath = e: v:
              if !isDerivation v then throw "flake attribute '${e.what}' is not a derivation"
              else if !(v ? name) then throw "derivation name missing in ${e.what}"
              else if !builtins.isString v.name || builtins.hasContext v.name then throw "the name of ${e.what} is not a string without context"
              else if !(v ? drvPath) then throw "${e.what} has no drvPath"
              else
                let
                  # As nix coerces a drvPath, copying nothing: a string as it
                  # is, a path in the store as it is (one outside it would be
                  # copied in, never as a .drv), an attribute set by what its
                  # __toString gives, or else by its outPath, coerced the same
                  # way.
                  coerce = x:
                    if builtins.isPath x then toString x
                    else if builtins.isAttrs x && x ? __toString then coerce (x.__toString x)
                    else if builtins.isAttrs x && x ? outPath then coerce x.outPath
                    else "${x}";
                  p = coerce v.drvPath;
                  name = builtins.substring (builtins.stringLength store) (builtins.stringLength p) p;
                in
                if builtins.substring 0 (builtins.stringLength store) p != store
                  || builtins.match drvName name == null || builtins.stringLength name > 33 + 211
                then throw "the drvPath of ${e.what} is not a store derivation's path"
                else p;
          in
          if builds then
            map (e: builtins.foldl' (v: n: v.${n}) outputs e.path) (builtins.filter build entries)
          else if entry == null then
            # legacyPackages has only its system names checked.
            builtins.deepSeq [ (here "legacyPackages" (_: [ ])) forced modules templates ] {
              other = builtins.filter (n: builtins.elem n refused) names;
              unknown = builtins.filter (n: !builtins.elem n (known ++ refused ++ community)) names;
              entries = map (e: { inherit (e) what; check = e.check or false; name = e.n or null; nixos = e.nixos or false; }) entries;
            }
          else
            let
              e = builtins.elemAt entries entry;
              v = builtins.foldl' (v: n: v.${n}) outputs e.path;
            in
            if e.nixos or false then
              (if isDerivation v then { } else throw "'config.system.build.toplevel' of ${e.what} is not a derivation")
            else { drv = drvPath e v; }
          EOF
          # Without eval-apart, the plan over one nix-instantiate's getFlake of
          # the flake as locked, with whether it has a nixConfig.
          read_plan() {
            url=$(nix flake metadata --json . | jq -r .url)
            args=(--option pure-eval true --argstr url "$url" --argstr system "$(nix config show system)" --argstr skip "$SKIP"
              --expr "{ url, system, skip, builds ? false }:
                let
                  flake = builtins.getFlake url;
                  planned = ($plan) { inherit system skip builds; } flake.outputs;
                in
                if builds then planned else planned // { nixConfig = import \"\${flake.outPath}/flake.nix\" ? nixConfig; }")
            nix-instantiate --eval --strict --json "${args[@]}" > "$RUNNER_TEMP/plan.json"
          }
          apart() {
            system=$(nix config show system)
            [[ $system =~ ^[A-Za-z0-9_-]+$ ]] || { echo "can't evaluate for system $system"; return 1; }
            work=$(mktemp -d "$RUNNER_TEMP/eval-apart.XXXXXX")
            trap 'rm -rf -- "$work"' EXIT
            # One snapshot of the checkout, as nix reads it: a git work tree's
            # tracked files as they are now, modes and all, its index, HEAD
            # and history (the repo's own objects, shared), its repository and
            # worktree settings, and each submodule checked out the same way
            # (any other left empty, as git leaves it), so self, clean or
            # dirty, is what nix flake check gives it. Everything here reads
            # the snapshot and nothing writes it (the lock file is used as it
            # is), so an edit to the checkout while the gate runs can't mix
            # two sources in one result.
            snapshot() {
              local top=$1 to=$2 common gitdir rev ref remote line f kv scope
              common=$(git -C "$top" rev-parse --path-format=absolute --git-common-dir)
              gitdir=$(git -C "$top" rev-parse --path-format=absolute --git-dir)
              git init -q --object-format="$(git -C "$top" rev-parse --show-object-format)" "$to"
              # The settings in effect there, the user's, the repository's and
              # the worktree's in that order, each with its includes (relative
              # and conditional ones too) resolved where the checkout is, and
              # frozen into the snapshot's own config, so the later ones still
              # win.
              : > "$to/.git/config"
              for scope in --global --local --worktree; do
                while IFS= read -r -d '' kv; do
                  case $kv in
                    *$'\n'*) set -- "${kv%%$'\n'*}" "${kv#*$'\n'}" ;;
                    *) set -- "$kv" true ;;
                  esac
                  case ${1,,} in include.path | includeif.*.path | core.worktree | core.bare) continue ;; esac
                  git config -f "$to/.git/config" --add "$1" "$2"
                done < <(git -C "$top" config "$scope" --includes --list -z 2> /dev/null)
              done
              git config -f "$to/.git/config" core.bare false
              # A relative submodule URL resolves against the default remote,
              # or with none against the work tree: the checkout's, not the
              # snapshot's.
              ref=$(git -C "$top" symbolic-ref -q HEAD) || ref=
              remote=$(git -C "$top" config "branch.${ref#refs/heads/}.remote") || remote=
              if ! git -C "$top" config "remote.${remote:-origin}.url" > /dev/null && ! git -C "$top" config remote.origin.url > /dev/null; then
                git config -f "$to/.git/config" remote.origin.url "$top"
              fi
              echo "$common/objects" > "$to/.git/objects/info/alternates"
              if [ -f "$common/shallow" ]; then cp -- "$common/shallow" "$to/.git/shallow"; fi
              if rev=$(git -C "$top" rev-parse -q --verify 'HEAD^{commit}'); then
                if [ -n "$ref" ]; then
                  git -C "$to" symbolic-ref HEAD "$ref"
                  git -C "$to" update-ref "$ref" "$rev"
                else
                  git -C "$to" update-ref --no-deref HEAD "$rev"
                fi
              fi
              if [ -f "$gitdir/index" ]; then cp -- "$gitdir/index" "$to/.git/index"; fi
              git -C "$top" ls-files -z | (cd "$top" && while IFS= read -r -d '' f; do
                if [ -L "$f" ] || [ -f "$f" ]; then printf '%s\0' "$f"; fi
              done | tar --null --no-recursion -T - -cf -) | tar -xpf - -C "$to"
              while IFS= read -r -d '' line; do
                f=${line#*$'\t'}
                if [ -e "$top/$f/.git" ]; then snapshot "$top/$f" "$to/$f" < /dev/null; else mkdir -p -- "$to/$f"; fi
              done < <(git -C "$top" ls-files -z -s | grep -z '^160000 ')
            }
            source=$work/source
            if top=$(git rev-parse --show-toplevel 2> /dev/null); then
              snapshot "$top" "$source"
              flake=$source/$(git rev-parse --show-prefix)
            else
              cp -a . "$source"
              flake=$source
            fi
            # nix flake check applies the nixConfig a runner accepts; the
            # evaluations and the build here would leave it out.
            if [ "$(nix-instantiate --eval --argstr f "$flake/flake.nix" --expr '{ f }: (import f) ? nixConfig')" = true ]; then
              echo "eval-apart can't carry this flake's nixConfig to every evaluation and build. Its gate is a whole \`nix flake check\`, without eval-apart."
              return 1
            fi
            # The flake's outputs ("#."), as nix flake check evaluates them,
            # each time afresh.
            evaluate() { nix eval --no-update-lock-file --option eval-cache false --apply "($plan) { system = \"$system\"; $1 }" "${@:2}" "$flake#."; }
            evaluate "" --json > "$RUNNER_TEMP/plan.json"
            if [ "$(jq '.other | length' "$RUNNER_TEMP/plan.json")" != 0 ]; then
              echo "eval-apart doesn't check apps, overlays, hydraJobs, bundlers or the old default* outputs, and this flake has $(jq -c .other "$RUNNER_TEMP/plan.json"). Its gate is a whole \`nix flake check\`, without eval-apart."
              return 1
            fi
            jq -r '.unknown[] | "warning: unknown flake output \u0027\(.)\u0027"' "$RUNNER_TEMP/plan.json"
            # Which entries are checks to build, and which checks are skipped.
            jq --arg skip "$SKIP" '($skip | split(" ") | map(select(. != ""))) as $s
              | .entries | map(.check and (.name as $n | $s | index([$n]) | not)) as $build
              | [range(length) as $i | .[$i] + {build: $build[$i], skip: (.[$i].check and ($build[$i] | not))}]' \
              "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/entries.json"
            # Each evaluation exits before the next starts, so the most memory
            # in use is one evaluation's. Each derivation is made a GC root at
            # once, until the build is done; one that isn't a valid derivation
            # (or that a GC took in between) fails the gate. A
            # failed evaluation fails the gate, after the rest are evaluated
            # and built (--keep-going).
            roots=$work/roots
            mkdir "$roots"
            failed=0
            targets=()
            n=$(jq length "$RUNNER_TEMP/entries.json")
            for ((i = 0; i < n; i++)); do
              what=$(jq -r ".[$i].what" "$RUNNER_TEMP/entries.json")
              echo "evaluating $what"
              if ! result=$(evaluate "entry = $i;" --json); then
                failed=1
              elif [ "$(jq ".[$i].nixos" "$RUNNER_TEMP/entries.json")" = true ]; then
                :
              elif ! drv=$(jq -er .drv <<< "$result") || ! nix-instantiate --add-root "$roots/$i" --argstr drv "$drv" \
                  --expr '{ drv }: { type = "derivation"; name = "root"; outputName = "out"; drvPath = drv; }' > /dev/null; then
                echo "evaluating $what gave no derivation"
                failed=1
              elif [ "$(jq ".[$i].build" "$RUNNER_TEMP/entries.json")" = true ]; then
                targets+=("$drv^*")
              elif [ "$(jq ".[$i].skip" "$RUNNER_TEMP/entries.json")" = true ]; then
                echo "not building $what"
              fi
            done
            if [ ${#targets[@]} -gt 0 ]; then
              nix build -L --no-link --keep-going "${targets[@]}" || failed=1
            fi
            return $failed
          }
          # Without eval-apart, the gate is nix flake check, as nix runs it. A
          # nix that builds what it evaluated holds every evaluation in memory
          # until its last build ends: burrow's checks took 12.6G, and beside
          # its VM tests on a 16G hosted runner the runner was shut down. So the
          # checks are built first, by derivation: one nix-instantiate evaluates
          # them and makes each a GC root, and once it has exited nix build
          # builds every output, as nix flake check would, which then finds them
          # built. A flake with a nixConfig, or whose plan can't be read, is
          # left to nix flake check alone: only nix applies the config a runner
          # accepts, and says what's wrong with a flake.
          whole() {
            failed=0
            built=false
            if read_plan && [ "$(jq .nixConfig "$RUNNER_TEMP/plan.json")" = false ]; then
              roots=$(mktemp -d "$RUNNER_TEMP/roots.XXXXXX")
              trap 'rm -rf -- "$roots"' EXIT
              targets=()
              if nix-instantiate --add-root "$roots/check" --arg builds true "${args[@]}" > "$roots/list"; then
                # A derivation whose first output isn't out has its root
                # printed with that output's name after a !. What's built
                # stays a root too, until nix flake check has found it.
                while read -r root; do targets+=("$(readlink "${root%%!*}")^*"); done < "$roots/list"
                if [ ${#targets[@]} -eq 0 ] || nix build -L --out-link "$roots/out" --keep-going "${targets[@]}"; then
                  built=true
                else
                  # Built once is enough: nix flake check only says what else
                  # is wrong, rather than build them again beside every
                  # evaluation.
                  nix flake check --no-build -L --keep-going || true
                  return 1
                fi
              else
                # nix flake check says which, and builds the rest.
                failed=1
              fi
            fi
            if [ -z "$SKIP" ]; then
              nix flake check -L --keep-going || failed=1
              return $failed
            fi
            nix flake check --no-build -L || return 1
            if [ "$built" = true ]; then
              for c in $SKIP; do echo "not building $c"; done
              return $failed
            fi
            system=$(nix eval --impure --raw --expr builtins.currentSystem)
            targets=()
            for c in $(nix eval --raw ".#checks.$system" --apply 'cs: toString (builtins.attrNames cs)'); do
              case " $SKIP " in *" $c "*) echo "not building $c"; continue ;; esac
              targets+=(".#checks.$system.$c")
            done
            nix build -L --no-link --keep-going "${targets[@]}" || failed=1
            return $failed
          }
          gate() {
            if [ "$APART" = true ]; then
              apart
            else
              whole
            fi
          }
          gate 2>&1 | tee "$RUNNER_TEMP/flake.log"
      # The gate's result, signed with this job's own GitHub identity, in the
      # format Conary reads (FieldmouseWorks/Conary, docs/ci-attestation.md).
      # GitHub attests for private repositories only on Enterprise Cloud, and
      # a run with no OIDC token (a fork's PR, Dependabot's) can't sign, so
      # those get none and their results don't count as evidence.
      - id: subject
        if: ${{ !cancelled() && steps.gate.outcome != 'skipped' && !github.event.repository.private && (github.event_name == 'push' || github.event_name == 'pull_request') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.gate.outcome }}
          SKIP: ${{ inputs.build-skip }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "no OIDC token in this run, so no attestation"
            exit 0
          fi
          case $OUTCOME in success) result=pass ;; *) result=fail ;; esac
          # Artifact names are shared by every job in a run, and a caller may
          # run this job more than once (a matrix, a re-run), so each log gets
          # its own.
          log="flake-log-$(cat /proc/sys/kernel/random/uuid)"
          dir="$RUNNER_TEMP/conary"
          mkdir -p "$dir"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The checked commit is the merge step's merge of the head onto
            # the base branch; its parents name both.
            { read -r tip; read -r head; } < <(git cat-file commit HEAD | sed -n 's/^parent //p')
            [ "$head" = "$PR_HEAD" ] || { echo "checked $(git rev-parse HEAD) isn't a merge of $PR_HEAD"; exit 1; }
            base=$(gh api "repos/$GITHUB_REPOSITORY/compare/$tip...$head" --jq .merge_base_commit.sha)
            subject="$dir/conary-revision"
            printf 'conary revision v1\n%s\n%s\n' "$base" "$head" > "$subject"
            revision=$(jq -n --arg base "$base" --arg head "$head" '{$base, $head}')
          else
            subject="$dir/conary-commit"
            printf 'conary commit v1\n%s\n' "$GITHUB_SHA" > "$subject"
            revision=null
          fi
          jq -n --arg result "$result" --argjson revision "$revision" \
            --arg tree "$(git rev-parse 'HEAD^{tree}')" --arg skip "$SKIP" \
            --arg sha256 "$(sha256sum "$RUNNER_TEMP/flake.log" | cut -d' ' -f1)" --arg artifact "$log" \
            '{$result, $revision, $tree, skipped: ($skip | split(" ") | map(select(. != ""))), log: {$sha256, $artifact}}' \
            > "$dir/predicate.json"
          cat "$subject" "$dir/predicate.json"
          { echo "path=$subject"; echo "log=$log"; } >> "$GITHUB_OUTPUT"
      - if: ${{ !cancelled() && steps.subject.outputs.path }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.subject.outputs.log }}
          path: ${{ runner.temp }}/flake.log
      - if: ${{ !cancelled() && steps.subject.outputs.path }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subject.outputs.path }}
          predicate-type: https://github.com/FieldmouseWorks/Conary/blob/main/docs/ci-attestation.md#v1
          predicate-path: ${{ runner.temp }}/conary/predicate.json
  # A PR's commits as GitHub sees them: each one unsigned, or signed by a key
  # GitHub matches to its committer. One signed by a key that isn't its
  # committer's (a session's own key on a commit given someone else's name and
  # email) shows as Unverified, as if someone were posing as them.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - id: signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The commits the PR adds, the ones HEAD has and its merge base with
          # BASE doesn't, with GitHub's verdict on each one's signature. Only
          # the commit and the verdict go in the log, never who committed it.
          compare="repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD"
          fork=$(gh api "$compare" --jq .merge_base_commit.sha)
          gh api --paginate "$compare?per_page=100" \
            --jq '.commits[] | [.sha, .commit.verification.reason] | @tsv' \
            > "$RUNNER_TEMP/commits.tsv"
          bad=0
          while IFS=$'\t' read -r sha reason; do
            case $reason in
              valid | unsigned) echo "$sha: $reason" ;;
              *)
                bad=1
                echo "::error title=Unverified commit::$sha is signed, but GitHub can't verify the signature for its committer ($reason), so it shows as Unverified. Commit as the identity that signs your commits, never under someone else's name and email. To fix it, recommit the branch that way (git rebase --rebase-merges --exec 'git commit --amend --no-edit --reset-author' $fork) and push it with --force-with-lease."
                ;;
            esac
          done < "$RUNNER_TEMP/commits.tsv"
          exit "$bad"
