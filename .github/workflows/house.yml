# burrow's own house check, through the same action every project calls
# (.github/actions/house), taken from this checkout so a PR runs its own
# version.
name: house
on:
  pull_request:
    # edited too: the check reads the PR's title and body, so fixing either
    # runs it again.
    types: [opened, edited, reopened, synchronize]
jobs:
  house:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/house
