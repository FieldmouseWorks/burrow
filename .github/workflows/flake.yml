# burrow's own gate, through the same shared workflow every project calls
# (flake-check.yml), taken from this checkout so a PR runs its own version.
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: ./.github/workflows/flake-check.yml
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # The agents check boots microVMs inside its test VM. A hosted runner
      # has KVM, and the test VM gets KVM of its own there, but a microVM that
      # deep boots about ten times slower and its kernel finds no PCI devices
      # (tried 2026-10-29). So CI only evaluates it; remi builds it on every
      # PR's head before the steward merges it (the `agents` status) and
      # before every deploy (remi's modules/burrow.nix, `proofJobs` and
      # `checks`).
      build-skip: agents
      # Evaluating the whole flake at once holds 6-7G until the last build
      # ends, beside everything else on remi, and flake-gate runs this same
      # gate in Claude jobs there, inputs and all.
      eval-apart: true
      # One runner took 55 minutes over burrow's gate (10-31): its outputs
      # evaluated one after another for 10, then its builds and fifteen VM
      # tests sharing four cores for 45. Four legs share them out over four
      # runners, which public repos get free.
      legs: 4
      # The docs lane, for a PR that changes only these: nothing burrow
      # builds or tests reads them. docs/, house/ and templates/ aren't on
      # it: the steward's config carries them (modules/autoland.nix,
      # baselineDocs), so every machine's build reads them.
      docs-paths: README.md AGENTS.md CLAUDE.md
