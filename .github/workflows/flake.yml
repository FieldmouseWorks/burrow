# burrow's own gate, through the same shared workflow every project calls
# (flake-check.yml), taken from this checkout so a PR runs its own version.
name: flake
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    uses: ./.github/workflows/flake-check.yml
    with:
      # The agents check boots a microVM and needs nested KVM, which hosted
      # runners don't have. CI still evaluates it; remi builds it before every
      # deploy (remi's modules/burrow.nix, `checks`).
      build-skip: agents
