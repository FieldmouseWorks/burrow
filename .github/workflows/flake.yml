# burrow's own gate, through the same shared workflow every project calls
# (flake-check.yml), taken from this checkout so a PR runs its own version.
#
# The merge train's candidates (a push to a conary/train/ branch: main with
# the PRs in it merged on top) run it in `train`, from main's copy instead:
# Conary counts a result only when the workflow that signed it is at a commit
# on burrow's main (its docs/ci-attestation.md, "Checking one", rule 2), and a
# candidate's own copy is a branch's, which could sign anything. So does a
# PR's negative run for the train (`train / negative`), which `train` makes
# beside the PR's own: with pr-gate off, a PR to main gets only that and its
# commits there, and its whole gate from `check`, until the train lands
# burrow's PRs. The train asks for `train / check`, and `train / negative`.
# Both skip the agents check, as `check` does (below), and the train counts
# no result that skipped one until the machine's proof of it on the
# candidate covers it (FieldmouseWorks/Conary#341).
name: flake
on:
  # A PR retargeted onto another branch runs from flake-retarget.yml.
  pull_request:
  push:
    branches: [main, "conary/train/**"]
# A PR's new run (a push, or a retarget from flake-retarget.yml, which has this
# name) cancels its last one the moment it's made, every job of it, so a
# superseded head's legs never hold a runner its new head waits for. The shared
# workflow's own job groups cancel a job only once its successor is queued,
# after the new run's first job got a runner (burrow#815). The same key as
# theirs: a push's run, and a title or body edit's, are their own.
concurrency:
  group: ${{ format('{0} {1}', github.workflow, (github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base)) && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id)) }}
  cancel-in-progress: true
jobs:
  # Everything but the train's candidates: main, and every PR.
  check:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/conary/train/')
    uses: ./.github/workflows/flake-check.yml
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      # The agents check boots microVMs inside its test VM. A hosted runner
      # has KVM, and the test VM gets KVM of its own there, but a microVM that
      # deep boots about ten times slower and its kernel finds no PCI devices
      # (tried 2026-10-29). So CI only evaluates it; remi builds it on every
      # PR's head before the steward merges it (the `agents` status) and
      # before every deploy (remi's modules/burrow.nix, `proofJobs` and
      # `checks`).
      build-skip: agents
      # Evaluating the whole flake at once holds 6-7G until the last build
      # ends, beside everything else on remi, and flake-gate runs this same
      # gate in Claude jobs there, inputs and all.
      eval-apart: true
      # One runner took 55 minutes over burrow's gate (10-31): its outputs
      # evaluated one after another for 10, then its builds and fifteen VM
      # tests sharing four cores for 45. Four legs share them out over four
      # runners, which public repos get free.
      legs: 4
      # And on an empty store each leg built what no public cache has: the
      # patched git (modules/common.nix), about 16 of a leg's 22-29 minutes,
      # and every check, changed or not. main's gate keeps those builds for
      # every later run to take (flake-check.yml says what's kept and why
      # that's safe).
      keep-builds: true
      # The docs lane, for a PR that changes only these: nothing burrow
      # builds or tests reads them. docs/, house/ and templates/ aren't on
      # it: the steward's config carries them (modules/autoland.nix,
      # baselineDocs), so every machine's build reads them.
      docs-paths: README.md AGENTS.md CLAUDE.md
  # GitHub expression equality ignores case; git branch names do not.
  # Route using the event's exact refs, without checking out PR code.
  train-route:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      train: ${{ steps.route.outputs.train }}
    steps:
      - id: route
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          train=false
          if [[ "$EVENT" == push && "$REF" == refs/heads/conary/train/* ||
                "$EVENT" == pull_request && "$BASE" == "$DEFAULT" ]]; then
            train=true
          fi
          echo "train=$train" >> "$GITHUB_OUTPUT"
  # The train's candidates, on GitHub's hosted runners (a VM of its own for
  # each job, which Conary counts as started fresh for it), and a PR to main's
  # negative run. The same gate as `check`, its four legs and all; main's
  # copy, which Renovate leaves at main (renovate.json): a pin would need a
  # PR after every merge.
  train:
    needs: train-route
    if: needs.train-route.outputs.train == 'true'
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@main
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      build-skip: agents
      eval-apart: true
      legs: 4
      keep-builds: true
      docs-paths: README.md AGENTS.md CLAUDE.md
      pr-gate: false
