# The gate again for a PR retargeted onto another branch: the shared workflow's
# run counts only for the base it judged, and which paths a PR changes,
# and so its lane (docs-paths), depend on its base. GitHub can't start a
# run only for a new base, so a title or body edit starts one here too, and its
# job skips. That's why this is a file of its own: in flake.yml the skipped run
# would become that workflow's latest, and a ruleset requiring `check / check`
# would stop counting the push's. It keeps flake.yml's name (the shared
# workflow's concurrency group takes the two as one workflow, as autoland does by
# these files' names), and its
# call matches flake.yml's (crates/burrow-workflows/src/lane.rs).
name: flake
on:
  pull_request:
    types: [edited]
jobs:
  check:
    if: github.event.changes.base
    uses: ./.github/workflows/flake-check.yml
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      build-skip: agents
      eval-apart: true
      legs: 4
      keep-builds: true
      docs-paths: README.md AGENTS.md CLAUDE.md
