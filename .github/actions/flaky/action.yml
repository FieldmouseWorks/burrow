# Flaky tests around a gate, as steps of a GitHub Actions job
# (docs/flaky-tests.md):
#
#   permissions:
#     issues: write
#   steps:
#     - uses: FieldmouseWorks/burrow/.github/actions/flaky@<commit>
#       with: { step: start }
#     - run: ./gate        # reads FLAKY_EXPIRED, writes FLAKY_REPORT
#     - uses: FieldmouseWorks/burrow/.github/actions/flaky@<commit>
#       if: ${{ !cancelled() }}
#       with: { step: file }
name: flaky
description: Quarantine flaky tests around a gate, and file the ones it finds
inputs:
  step:
    description: "start, before the gate: FLAKY_EXPIRED and FLAKY_REPORT for it; file, after it: its report filed"
    required: true
  token:
    description: A token that can read and write the repo's issues
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    # From this action's own commit, on the runner's cargo, in the crates'
    # directory: rustup reads the toolchain from where cargo runs, so this
    # builds with the one crates/rust-toolchain.toml pins, not the caller's.
    # Once a job, by start, for file to run too.
    - name: Build flaky
      if: inputs.step == 'start'
      shell: bash
      working-directory: ${{ github.action_path }}/../../../crates
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/flaky-build
      run: cargo build --release --locked --quiet -p flaky
    - name: Run flaky's step
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        STEP: ${{ inputs.step }}
      run: '"$RUNNER_TEMP/flaky-build/release/flaky" action "$STEP"'
