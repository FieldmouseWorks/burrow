# The gate is the flake: CI only runs `nix flake check`, through burrow's
# shared workflow. Jobs the flake can't hold (browsers, VMs) go alongside.
name: flake
on:
  # `edited` for a PR retargeted onto another branch: the shared workflow's
  # run counts only for the base it judged, so a new base needs a run.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
jobs:
  check:
    # Of the edits, only a new base: a title or body changes nothing checked.
    if: github.event.action != 'edited' || github.event.changes.base
    uses: FieldmouseWorks/burrow/.github/workflows/flake-check.yml@main
    # What the shared workflow needs to attest its result.
    permissions:
      contents: read
      id-token: write
      attestations: write
    # On a self-hosted NixOS runner (a private repo out of hosted minutes):
    # with: { runner: remi, install-nix: false }
